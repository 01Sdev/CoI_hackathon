<!doctype html>
<html lang="ko" data-theme="dark">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>코디 UI 미리보기</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #eeeae4; color: #272923; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
      .outfit-demo { max-width: 1440px; margin: auto; }
      .outfit-demo__tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 14px; line-height: 20px; }
      .outfit-demo__tools button { padding: 8px 12px; border: 1px solid #caccbf; border-radius: 8px; background: #fbfbf8; color: #272923; font: inherit; cursor: pointer; }
      .outfit-demo__scene { position: relative; height: min(78vh, 800px); min-height: 480px; overflow: hidden; border-radius: 16px; background: #b9b5a8; }
      .outfit-demo__label { position: absolute; top: 24px; left: 24px; color: #30332a; font-size: 14px; line-height: 20px; }
      .outfit-demo__frame { position: absolute; left: 14%; top: 8%; width: 72%; height: 88%; border: 1px solid #fff; background: #ffffff0a; pointer-events: none; }
      .outfit-demo__person { position: absolute; top: 15%; left: 28%; width: 22%; height: 70%; color: #53564b; }
      .outfit-demo__person svg { width: 100%; height: 100%; }
      .outfit-demo__note { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: #5a4f42; }
      @media (max-width: 680px) { body { padding: 12px; } .outfit-demo__scene { height: 560px; min-height: 0; } .outfit-demo__label { top: 12px; left: 12px; } }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="./outfit-assistant.tsx"></script></body>
</html>
